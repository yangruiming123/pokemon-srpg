    '<h4>文件1 · 地图相关数据</h4>' +
    '<table class="rtable"><tr><th>Id 地形</th><th>高度</th><th>效果</th></tr>' + terrRows + '</table>' +
    '地图资源：<code>10×10</code> 格子（x:0~9，y:0~9）；场地效果 <code>01</code> 攻击距离+1' +
    '<h4>文件2 · 宝可梦相关数据</h4>' +
    '<table class="rtable"><tr><th>Id 名称</th><th>属性</th><th>血量</th><th>技能/伤害/范围</th><th>移动力(形态)</th></tr>' + pokeRows + '</table>' +
    typeChartTable() +
    '<table class="rtable"><caption>技能效果</caption><tr><th>标签·编号</th><th>名称</th><th>效果</th></tr>' + buffRows + '</table>' +
    '<h4>文件3 · 战斗数据储存与计算</h4>' +
    '<ul><li>临时移动力 = 移动力 + 移动类 Buff 效果，随后做 BFS 四向延展，消耗 = <code>1 + 高度差</code>，高度 ≥2 不可扩展</li>' +
    '<li>攻击函数：敌方血量 = 敌方血量 − 技能伤害 × 属性倍率（庇护再减免 10 点）</li>' +
    '<li>Buff 链表分「回合（每回合 −1）」与「次数（使用后 −1）」两类</li></ul>' +
    '<h4>文件5 · 游戏启动</h4>' +
    '<ul><li>初始界面 → 布置界面1（玩家一，格子 00/01/10/11）→ 布置界面2（玩家二）→ 战斗页面</li>' +
    '<li>战斗页面记录 <code>A1=2, A2=2</code>，全部存活=是、可行动=否</li>' +
    '<li>玩家一 ↔ 玩家二 无限循环，直至某方 A 值为 0</li>' +
    '<li>右键优先级：部署界面 &gt; 战斗界面 &gt; 胜利/失败界面</li></ul>' +
    '<h4>原型补充假设</h4>' +
    '<ul><li>布置界面2 文档同为 00/01/10/11，会与玩家一重叠，此处改为对角区域 (8,8)(9,8)(8,9)(9,9)</li>' +
    '<li>移动时敌方占据格不可通行，任何占据格不可停留</li>' +
    '<li>回合型 Buff 在其持有者所属玩家回合结束时 −1</li>' +
    '<li>海 / 空移动形态文档标注「待定」，本作按陆行同等处理</li></ul>' +
    '</div>';
  openModal({ kind: 'rules', wide: true, title: '规则与数据速查', body: body, closable: true, buttons: [{ text: '关闭', cls: 'btn-ghost', act: function () { closeModal(); } }] });
}

/* SECTION: ui-cellclick */
function onCellClick(x, y) {
  if (S.busy) { toast('移动动画播放中，不可进行输入', 'warn'); return; }
  if (S.screen === 'deploy') { deployCellClick(x, y); return; }
  if (S.screen === 'battle') { battleCellClick(x, y); return; }
}

function deployCellClick(x, y) {
  if (!isDeployCell(x, y)) { toast('只有黄色高亮格可以放置', 'warn'); return; }
  var onBoard = placedAt(x, y);
  if (S.phase === 'select') {
    if (onBoard) { deployDoReplace(x, y); return; }   // 替换
    deployDoPlace(x, y);                              // 放置
    return;
  }
  // 闲置状态：点击可放置区域的宝可梦 → 记录并进入选择状态
  if (onBoard) {
    S.deploy.picked = onBoard.id;
    S.deploy.pickFrom = 'board';
    S.deploy.pickCell = { x: x, y: y };
    S.phase = 'select';
    render();
    return;
  }
  toast('闲置状态：请先点击左侧宝可梦，再点空格放置', 'warn');
}

function battleCellClick(x, y) {
  var u = unitAt(x, y, null);
  if (S.phase === 'idle') {
    if (!u) { uiInspect = null; render(); return; }
    uiInspect = u.no;
    if (u.alive && u.side === S.current && u.canAct) { selectUnit(u); return; }
    render();
    if (!u.alive) toast(u.base.name + ' 存活状态=否，无法行动', 'warn');
    else selectUnit(u); // 内部会给出不可行动提示
    return;
  }
  if (S.phase === 'moveCalc') { tryMoveTo(x, y); return; }
  if (S.phase === 'atkCalc') { tryTargetUnit(x, y); return; }
}

/* SECTION: ui-actions */
function doAction(a) {
  switch (a) {
    case 'cancelPick':
      deployReset(); S.phase = 'idle'; logAdd('取消选择（右键）', 'sys'); render(); break;
    case 'restartDeploy':
      S.deploy.placed = []; S.deploy.n = 0; deployReset(); S.phase = 'idle';
      logAdd(playerLabel(S.deploy.player) + ' 重新布置，n=0', 'sys'); render(); break;
    case 'cancelMove': cancelMoveCalc(); break;
    case 'revert': closeModal(); revertToRecorded(); break;
    case 'atk': closeModal(); chooseAttack(); break;
    case 'wait': closeModal(); chooseWait(); break;
    case 'backChoice': backToMovedChoice(); break;
    case 'endTurn': askEndTurn(); break;
    case 'toTitle': backToTitle(); break;
    default: break;
  }
}

/* SECTION: ui-events */
function bindEvents() {
  $('btnStart').addEventListener('click', function () { bootGame(); });
  $('btnRulesTitle').addEventListener('click', openRules);
  var rs = $('btnRescan');
  if (rs) rs.addEventListener('click', rescanSprites);
  $('segMap').addEventListener('click', function (e) {
    var b = e.target.closest('[data-preset]');
    if (!b) return;
    S.mapPreset = b.getAttribute('data-preset');
    window.__lastPreset = S.mapPreset;
    renderTitle();
  });

  // 地图点击（事件委托）
  boardEl.addEventListener('click', function (e) {
    var c = e.target.closest('.cell');
    if (!c) return;
    onCellClick(+c.getAttribute('data-x'), +c.getAttribute('data-y'));
  });

  // 右键：按当前界面状态切换
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    if (S.screen === 'title') return;
    onRightClick();
  });

  // 触屏长按等效右键
  boardEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    var c = e.target.closest('.cell');
    if (!c) return;
    longPressTimer = setTimeout(function () {
      longPressTimer = null;
      onRightClick();
    }, 620);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(function (ev) {
    boardEl.addEventListener(ev, function () {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }, { passive: true });
  });

  // 左/右面板与操作条委托
  document.addEventListener('click', function (e) {
    var pick = e.target.closest('[data-pick]');
    if (pick) {
      S.deploy.picked = pick.getAttribute('data-pick');
      S.deploy.pickFrom = 'list'; S.deploy.pickCell = null;
      S.phase = 'select';
      logAdd('记录宝可梦 <b>' + getPokemon(S.deploy.picked).name + '</b>，进入选择状态', 'sys');
      render(); return;
    }
    var dc = e.target.closest('[data-dcell]');
    if (dc) {
      var p = dc.getAttribute('data-dcell').split(',');
      var it = placedAt(+p[0], +p[1]);
      if (it) {
        S.deploy.picked = it.id; S.deploy.pickFrom = 'board'; S.deploy.pickCell = { x: +p[0], y: +p[1] };
        S.phase = 'select'; render();
      }
      return;
    }
    var un = e.target.closest('[data-unit]');
    if (un) { uiInspect = +un.getAttribute('data-unit'); render(); return; }

    if (e.target.closest('#btnDelete')) { deployDoDelete(); return; }
    if (e.target.closest('#btnDeployOk')) { deployConfirm(); return; }
    if (e.target.closest('#btnRulesBattle')) { openRules(); return; }

    var act = e.target.closest('[data-act]');
    if (act) { doAction(act.getAttribute('data-act')); return; }

    // 行动阶段弹窗：点击任意位置弹窗消失
    if (layerEl.getAttribute('data-kind') === '' && !layerEl.classList.contains('hidden')) closeModal();
  });

  // 键盘快捷键（桌面辅助）
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { onRightClick(); }
  });
}

/* SECTION: ui-sprite-status */
// 标题页贴图自检：列出素材目录、各地块与各动作已识别的帧数
function renderSpriteStatus() {
  var box = $('sprStatus'), rootEl = $('sprRoot');
  if (!box) return;
  if (typeof scanSprites !== 'function') { box.textContent = '未启用贴图层'; return; }
  if (SPR.scanning) { box.innerHTML = '扫描中…'; return; }
  if (rootEl) rootEl.textContent = SPR.root ? '（素材目录 ' + SPR.root + '）' : '';

  var rows = [], found = 0, total = 0;
  for (var t in TILE_FILES) {
    total++;
    var ok = !!SPR.tiles[t];
    if (ok) found++;
    rows.push((ok ? '✅' : '⬜') + ' 地块 ' + TERRAINS[t].name + ' → <code>' + TILE_FILES[t] + '</code>');
  }
  for (var p in UNIT_SPRITES) {
    var base = getPokemon(p), cfg = UNIT_SPRITES[p];
    for (var ai = 0; ai < ACTION_LIST.length; ai++) {
      var act = ACTION_LIST[ai];
      var fr = framesOf(p, act);
      total++;
      if (fr.length) found++;
      var cn = { idle: '待机', run: '移动', attack: '攻击' }[act] || act;
      var loop = LOOP_ACTIONS[act] ? '循环' : '播放至结束';
      rows.push((fr.length ? '✅' : '⬜') + ' ' + (base ? base.name : p) + ' · ' + cn +
        '（' + loop + '）→ <code>' + cfg.dir + '/' + cfg.dir + '_' + act + '_01.png</code>' +
        (fr.length ? ' 已识别 ' + fr.length + ' 帧（' + fr[0].w + '×' + fr[0].h + '）' : ' 缺'));
    }
  }
  var miss = total - found;
  box.innerHTML = '<div style="margin-bottom:5px">已识别 <b style="color:var(--ok)">' + found +
    '</b> / ' + total + ' 项' + (miss ? '，缺 ' + miss + ' 项（缺图自动回退文字，可只放一张先试）' : '，素材齐全') + '</div>' +
    rows.join('<br>') +
    '<div style="margin-top:6px;color:var(--dim2)">镜像说明：只需出一套「' +
    (UNIT_SPRITES['01'] ? UNIT_SPRITES['01'].facing : 'left') + '」朝向的图，另一方向由程序自动镜像。</div>';
}

function rescanSprites() {
  SPR.scanned = false;
  SPR.tiles = {};
  SPR.units = {};
  SPR.root = null;
  renderSpriteStatus();
  scanSprites(function () {
    renderSpriteStatus();
    render();
    var n = 0;
    for (var t in SPR.tiles) if (SPR.tiles[t]) n++;
    var m = 0;
    for (var p in SPR.units) for (var a in SPR.units[p]) m += SPR.units[p][a].length;
    toast('扫描完成：地块 ' + n + ' 种，动作帧 ' + m + ' 张', (n || m) ? '' : 'warn');
    logAdd('重新扫描贴图：地块 ' + n + ' 种，动作帧 ' + m + ' 张', 'sys');
  });
}

/* SECTION: ui-boot */
S = newState();
renderTitle();
bindEvents();
render();
logAdd('原型已就绪：未放置贴图时以文字与色块呈现', 'sys');

// 启动扫描贴图：放几张显示几张，缺图自动回退文字
if (typeof scanSprites === 'function') {
  renderSpriteStatus();
  scanSprites(function () {
    renderSpriteStatus();
    render();
    var n = 0;
    for (var t in SPR.tiles) if (SPR.tiles[t]) n++;
    var m = 0;
    for (var p in SPR.units) for (var a in SPR.units[p]) m += SPR.units[p][a].length;
    if (n || m) {
      logAdd('已加载贴图：地块 ' + n + ' 种 · 动作帧 ' + m + ' 张', 'ok');
      SPR.notes.forEach(function (s) { logAdd('· ' + s, 'sys'); });
    } else {
      logAdd('未检测到贴图（img/ 目录为空或不存在），当前为纯文字模式', 'sys');
    }
    toast((n || m) ? ('贴图已加载：地块 ' + n + ' 种，动作帧 ' + m + ' 张') : '未检测到贴图，当前为纯文字模式',
      (n || m) ? '' : 'warn');
  });
}

</script>
